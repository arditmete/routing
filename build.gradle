plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web (includes RestClient, Jackson, Jakarta Servlet API)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Cache
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Spring Boot Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Caffeine Cache
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // OpenAPI / Swagger UI (io.swagger.v3.oas.annotations)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
    // RoutingApplication contains only the bootstrap main() entrypoint.
    // It cannot be meaningfully tested without starting a real server, so it is excluded here.
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(it) {
                exclude 'com/example/routing/RoutingApplication.class'
            }
        })
    )
}
