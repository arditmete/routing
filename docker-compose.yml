version: "3.9"

services:
  routing-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: routing-service:latest
    container_name: routing-service
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
      - APP_COUNTRIES_URL=https://raw.githubusercontent.com/mledoze/countries/master/countries.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
